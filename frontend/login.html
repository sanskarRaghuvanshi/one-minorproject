<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OneSpace - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      "colors": {
        "surface-variant": "#e5e2e1", "on-primary-container": "#dad7ff", "secondary-container": "#d0e1fb",
        "surface": "#fcf9f8", "secondary": "#505f76", "inverse-surface": "#313030",
        "secondary-fixed-dim": "#b7c8e1", "background": "#fcf9f8", "on-tertiary": "#ffffff",
        "inverse-on-surface": "#f3f0ef", "on-surface": "#1c1b1b", "tertiary-fixed": "#ffdbcc",
        "on-error": "#ffffff", "surface-container-low": "#f6f3f2", "primary": "#3525cd",
        "secondary-fixed": "#d3e4fe", "error-container": "#ffdad6", "inverse-primary": "#c3c0ff",
        "on-error-container": "#93000a", "surface-bright": "#fcf9f8", "tertiary-container": "#a44100",
        "on-tertiary-fixed": "#351000", "surface-container-lowest": "#ffffff",
        "on-secondary-container": "#54647a", "primary-fixed-dim": "#c3c0ff",
        "on-primary-fixed": "#0f0069", "tertiary-fixed-dim": "#ffb695",
        "on-surface-variant": "#464555", "primary-fixed": "#e2dfff", "surface-tint": "#4d44e3",
        "on-tertiary-container": "#ffd2be", "on-secondary-fixed": "#0b1c30",
        "surface-dim": "#dcd9d9", "surface-container-highest": "#e5e2e1",
        "on-background": "#1c1b1b", "surface-container-high": "#ebe7e7",
        "surface-container": "#f0edec", "outline": "#777587", "tertiary": "#7e3000",
        "on-secondary-fixed-variant": "#38485d", "on-tertiary-fixed-variant": "#7b2f00",
        "error": "#ba1a1a", "on-secondary": "#ffffff", "outline-variant": "#c7c4d8",
        "on-primary": "#ffffff", "primary-container": "#4f46e5",
        "on-primary-fixed-variant": "#3323cc"
      },
      "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
      "spacing": { "lg": "24px", "xl": "32px", "base-unit": "4px", "xs": "4px", "gutter": "24px", "margin": "24px", "sm": "8px", "md": "16px" },
      "fontFamily": { "display-lg": ["Inter"], "label-sm": ["Inter"], "headline-sm": ["Inter"], "headline-md": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "label-caps": ["Inter"] },
      "fontSize": {
        "display-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
        "label-sm": ["12px", { "lineHeight": "1", "fontWeight": "500" }],
        "headline-sm": ["18px", { "lineHeight": "1.4", "fontWeight": "600" }],
        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]
      }
    }
  }
}
</script>
<style>.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }</style>
<link href="css/style.css" rel="stylesheet"/>
</head>
<body class="bg-background dark:bg-inverse-surface min-h-screen flex items-center justify-center relative overflow-hidden text-on-background dark:text-inverse-on-surface font-body-md">
<div class="absolute inset-0 bg-pattern opacity-[0.03] pointer-events-none z-0"></div>
<div class="absolute top-[-10%] left-[-5%] w-[40vw] h-[40vw] max-w-[500px] max-h-[500px] bg-primary rounded-full blur-[120px] opacity-10 pointer-events-none z-0"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[30vw] h-[30vw] max-w-[400px] max-h-[400px] bg-secondary-container rounded-full blur-[100px] opacity-30 pointer-events-none z-0"></div>

<div class="w-full max-w-[420px] p-margin z-10 relative">
  <div class="bg-surface dark:bg-surface-container-low border border-outline-variant dark:border-outline rounded-xl p-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] flex flex-col">
    <div class="text-center mb-xl">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-primary-container rounded-lg mb-md">
        <span class="material-symbols-outlined text-on-primary-container text-[28px]" style="font-variation-settings: 'FILL' 1;">dashboard</span>
      </div>
      <h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Welcome back</h1>
      <p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue to your workspaces</p>
    </div>

    <!-- Error Alert -->
    <div id="loginError" class="d-none bg-error-container text-on-error-container p-sm rounded-lg font-body-md text-body-md mb-md"></div>

    <form id="loginForm" class="space-y-gutter flex-grow needs-validation" novalidate>
      <div class="flex flex-col gap-xs">
        <label class="font-label-sm text-label-sm text-on-surface" for="identifier">Email or username</label>
        <input class="w-full h-[44px] px-md py-sm bg-surface dark:bg-inverse-surface border border-outline-variant dark:border-outline rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors" id="identifier" name="email" placeholder="name@university.edu or username" type="text" autocomplete="username" required/>
        <div class="invalid-feedback text-error text-xs">Please enter a valid email address.</div>
      </div>
      <div class="flex flex-col gap-xs">
        <div class="flex justify-between items-center">
          <label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
          <a class="font-label-sm text-label-sm text-primary hover:underline" href="#" onclick="event.preventDefault(); showForgotPasswordNotice()">Forgot password?</a>
        </div>
        <div class="relative">
          <input class="w-full h-[44px] px-md py-sm pr-12 bg-surface dark:bg-inverse-surface border border-outline-variant dark:border-outline rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors" id="password" name="password" placeholder="Enter your password" type="password" required minlength="6"/>
          <button class="absolute inset-y-0 right-0 flex items-center pr-md text-on-surface-variant hover:text-on-surface focus:outline-none" type="button" id="togglePassword" aria-label="Show password">
            <i class="material-symbols-outlined text-[20px]">visibility_off</i>
          </button>
          <div class="invalid-feedback text-error text-xs">Password is required.</div>
        </div>
      </div>
      <button class="w-full h-[44px] bg-primary hover:bg-primary-fixed-variant text-on-primary font-label-sm text-label-sm rounded-DEFAULT flex items-center justify-center gap-sm transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit" id="loginBtn">
        <span class="btn-text flex items-center gap-sm">Log In <span class="material-symbols-outlined text-[18px]">arrow_forward</span></span>
        <span class="btn-loading d-none"><span class="w-4 h-4 border-2 border-on-primary/30 border-t-on-primary rounded-full animate-spin inline-block"></span> Signing in...</span>
      </button>
    </form>

    <div class="relative flex items-center py-lg mt-md">
      <div class="flex-grow border-t border-outline-variant"></div>
      <span class="flex-shrink-0 mx-md font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">or</span>
      <div class="flex-grow border-t border-outline-variant"></div>
    </div>
    <p class="text-center font-body-md text-body-md text-on-surface-variant mt-2">
      Don't have an account? <a class="font-label-sm text-label-sm text-primary hover:underline font-medium" href="register.html">Sign up</a>
    </p>
  </div>
<div id="toast-container" class="fixed bottom-20 md:bottom-8 right-4 z-[200] flex flex-col gap-sm"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
